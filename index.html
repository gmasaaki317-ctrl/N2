```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>謎解き</title>
</head>
<body>
  <h1>謎解き</h1>

  <input type="text" id="answer" placeholder="答えを入力してください">
  <button onclick="checkAnswer()">回答する</button>

  <p id="message"></p>

  <script>
    function checkAnswer() {
      const answer = document.getElementById("answer").value.trim();
      const message = document.getElementById("message");

      if (answer.toLowerCase() === "complete") {
        message.textContent =
          "正解です。お疲れ様でした。それでは、本当の真実をお教えします。";
      } else {
        message.textContent = "不正解です。もう一度考えてみてください。";
      }
    }
  </script>
</body>
</html>
```
